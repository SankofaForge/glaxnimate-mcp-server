[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "glaxnimate-mcp-server"
version = "0.1.0"
description = "A portable MCP server for inspecting and animating SVG assets for Glaxnimate workflows"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Yonas Valentin" }]
dependencies = ["mcp>=1.12,<3"]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[project.scripts]
glaxnimate-mcp = "glaxnimate_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/glaxnimate_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--cov=glaxnimate_mcp --cov-report=term-missing --cov-fail-under=100"

[tool.coverage.run]
source = ["glaxnimate_mcp"]
branch = true

[tool.coverage.report]
fail_under = 100
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]
